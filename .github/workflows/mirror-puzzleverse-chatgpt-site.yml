name: Mirror PuzzleVerse ChatGPT site

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/mirror-puzzleverse-chatgpt-site.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mirror-puzzleverse-chatgpt-site
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Mirror the published PuzzleVerse site
        shell: bash
        env:
          SOURCE_URL: https://puzzleverse.syed40175.chatgpt.site/
          SOURCE_HOST: puzzleverse.syed40175.chatgpt.site
        run: |
          set -euo pipefail

          workdir="$(mktemp -d)"
          echo "WORKDIR=$workdir" >> "$GITHUB_ENV"

          http_code="$(curl --location --silent --show-error \
            --output "$workdir/source-home.html" \
            --write-out '%{http_code}' \
            "$SOURCE_URL")"

          if [[ "$http_code" != "200" ]]; then
            echo "Source site returned HTTP $http_code; refusing to replace the current site."
            exit 1
          fi

          if ! grep -qi 'PuzzleVerse' "$workdir/source-home.html"; then
            echo "Source response does not look like the PuzzleVerse site; refusing to replace the current site."
            exit 1
          fi

          wget \
            --quiet \
            --mirror \
            --page-requisites \
            --convert-links \
            --adjust-extension \
            --no-parent \
            --directory-prefix="$workdir/mirror" \
            "$SOURCE_URL"

          source_dir="$workdir/mirror/$SOURCE_HOST"

          if [[ ! -s "$source_dir/index.html" ]]; then
            echo "Mirror did not produce a usable index.html; refusing to replace the current site."
            exit 1
          fi

          mkdir -p "$workdir/site"
          cp -a "$source_dir/." "$workdir/site/"

          # Keep the AdMob publisher declaration on the GitHub Pages domain.
          cp app-ads.txt "$workdir/site/app-ads.txt"

          # Preserve the Play privacy route if it exists in the repository.
          if [[ -d puzzleverse-privacy ]]; then
            mkdir -p "$workdir/site/puzzleverse-privacy"
            cp -a puzzleverse-privacy/. "$workdir/site/puzzleverse-privacy/"
          fi

          # GitHub Pages/Jekyll can omit framework asset directories whose names
          # begin with an underscore (for example _next) unless this file exists.
          touch "$workdir/site/.nojekyll"

          # Replace the old website files in the repository only after the source
          # mirror has passed the checks above. Repository metadata and operational
          # files stay intact.
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='README.md' \
            --exclude='app-ads.txt' \
            --exclude='puzzleverse-privacy/' \
            "$workdir/site/" ./

          cp "$workdir/site/app-ads.txt" app-ads.txt
          git diff --check

      - name: Commit the mirrored site to main
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Repository already matches the current mirror."
          else
            git commit -m "Mirror PuzzleVerse ChatGPT site"
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload mirrored Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ env.WORKDIR }}/site

  deploy:
    needs: mirror
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy mirrored site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
